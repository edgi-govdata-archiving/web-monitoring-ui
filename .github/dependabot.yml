version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "10:00"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      babel:
        patterns:
          - 'babel'
          - '@babel/*'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
      jest:
        patterns:
          - 'jest'
          - 'jest-*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
      testinglibrary:
        patterns:
          - '@testing-library/*'
      webpack:
        patterns:
          - 'webpack'
          - 'webpack-*'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        # TODO: stop ignoring 26 when it becomes LTS.
        # NOTE: 25 will never be LTS, but starting with 27, odd numbers will.
        versions: ["25", "26"]
